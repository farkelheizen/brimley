[project]
name = "brimley"
version = "0.6.1"
description = "A lightweight, file-based function execution engine."
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Bill Spratley", email = "billspratley@gmail.com"}
]
requires-python = ">=3.10,<4.0"
keywords = ["mcp", "tools", "function-execution", "ai-tooling", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "sqlalchemy>=2.0.46",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
fastmcp = ["fastmcp>=3.1.1,<4.0.0"]

[project.urls]
Homepage = "https://github.com/farkelheizen/brimley"
Source = "https://github.com/farkelheizen/brimley"
Issues = "https://github.com/farkelheizen/brimley/issues"
Changelog = "https://github.com/farkelheizen/brimley/blob/main/CHANGELOG.md"

[project.scripts]
brimley = "brimley.cli.main:app"

[tool.poetry]
packages = [{include = "brimley", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
twine = "^6.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"