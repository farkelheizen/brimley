[tool.poetry]
name = "brimley"
version = "0.6.0"
description = "A lightweight, file-based function execution engine."
authors = ["Bill Spratley <billspratley@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "brimley", from = "src"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.0"
pydantic-settings = "^2.0"
typer = "^0.12"
jinja2 = "^3.1"
pyyaml = "^6.0"
rich = "^13.0"
prompt_toolkit = "^3.0"
sqlalchemy = "^2.0.46"
loguru = "^0.7.2"
fastmcp = {version = "*", optional = true}

[tool.poetry.extras]
fastmcp = ["fastmcp"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
brimley = "brimley.cli.main:app"