name: get_system_load
type: cli_function
description: "Returns the current system load average using the uptime command"
return_shape: string

mcp:
  type: tool

command: "uptime"
command_arguments: []
timeout_seconds: 10

results:
  "0":
    type: regex
    parse:
      pattern: "load average[s]?:\\s*(?P<load_1min>[0-9]+\\.[0-9]+)"
      capture_group: "load_1min"
  "default":
    error: "uptime command failed"
