services:
  oracle-free:
    image: container-registry.oracle.com/database/free:latest
    container_name: brimley-oracle-free
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
    volumes:
      - oracle_data:/opt/oracle/oradata

volumes:
  oracle_data: