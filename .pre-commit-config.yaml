repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (secret scanning)
        args:
          - "--baseline"
          - ".secrets.baseline"
        exclude: |
          (?x)^(
            poetry\.lock|
            tests/.*\.py|
            examples/.*
          )$
